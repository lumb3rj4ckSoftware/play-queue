<div id="drawStage" class="draw-stage" aria-hidden="true">
  <div class="draw-vignette"></div>
  <div class="draw-smoke draw-smoke-one"></div>
  <div class="draw-smoke draw-smoke-two"></div>
  <div id="drawFx" class="draw-fx" aria-hidden="true"></div>
  <div id="drawShotFlash" class="draw-shot-flash" aria-hidden="true"></div>
  <div id="drawCrosshair" class="draw-crosshair" aria-hidden="true">
    <span></span>
  </div>
  <div id="drawTargetLock" class="draw-target-lock" aria-hidden="true">ZIEL ERFASST</div>
  <div id="drawWeapon" class="draw-weapon" aria-hidden="true">
    <span class="draw-weapon-body"></span>
    <span class="draw-weapon-stock"></span>
    <span class="draw-weapon-grip"></span>
  </div>
  <div id="drawMuzzleFlash" class="draw-muzzle-flash" aria-hidden="true"></div>

  <div class="draw-content">
    <header class="draw-header">
      <p class="draw-kicker">STEINHQ PRÄSENTIERT</p>
      <h1 id="drawTitle">SCHICHTWECHSEL</h1>
      <p id="drawSubtitle" class="draw-subtitle">2 PLÄTZE · 4 KANDIDATEN · KEINE GNADE</p>
      <div class="draw-rule"><span></span></div>
    </header>

    <section id="drawMain" class="draw-main">
      <div class="draw-section-heading">
        <span id="drawRoundLabel">WER BLEIBT IM TEAM?</span>
        <strong id="drawRoundCounter">AUSLOSUNG</strong>
      </div>
      <div id="drawCandidateGrid" class="draw-candidate-grid"></div>

      <div class="draw-challenger-zone">
        <div class="draw-challenger-title">
          <span>WARTEN AUF IHREN EINSATZ</span>
          <span class="draw-live-pill">QUEUE</span>
        </div>
        <div id="drawChallengerGrid" class="draw-challenger-grid"></div>
      </div>
    </section>

    <section id="drawFinal" class="draw-final" aria-hidden="true">
      <p class="draw-final-kicker">DIE WÜRFEL SIND GEFALLEN</p>
      <h2>NEUE AUFSTELLUNG</h2>
      <div id="drawFinalGrid" class="draw-final-grid"></div>
      <div id="drawBenchLine" class="draw-bench-line"></div>
    </section>

    <footer class="draw-footer">
      <span>REIN IN DEN BUS</span>
      <span class="draw-fair"><i></i> SERVERSEITIG AUSGELOST</span>
    </footer>
  </div>
</div>
