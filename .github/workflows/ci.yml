name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12']
        include:
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testabhängigkeiten installieren
        run: python -m pip install -r requirements-test.txt
      - name: Python-Syntax prüfen
        run: python -m compileall -q app.py alias_ai.py gsi_engine.py steam_links.py tests
      - name: Python-Tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript-Syntax prüfen
        run: node --check static/admin.js && node --check static/name_search.js && node --check static/overlay.js && node --check static/draw_overlay.js
      - name: JavaScript-Tests
        run: node tests/test_admin_search.cjs
